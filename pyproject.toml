[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "aereo-measurements"
version = "0.1.0"
description = "Geospatial file measurements with explicit CRS and units"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.135.1",
  "uvicorn==0.41.0",
  "python-multipart==0.0.22",
  "shapely==2.1.2",
  "pyproj==3.7.2",
  "pyshp==3.0.3",
  "defusedxml==0.7.1",
]

[project.optional-dependencies]
dev = ["pytest==9.0.2", "httpx==0.28.1", "ruff==0.15.5", "mypy==1.19.1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true
